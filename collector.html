<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Studio Perekam Dataset Isyarat (126 Fitur)</title>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <script src="js/normalizer.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #0f172a; color: #f8fafc; padding: 16px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
    
    header { width: 100%; max-width: 1100px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; flex-wrap: wrap; gap: 10px; }
    .header-titles h1 { font-size: 1.35rem; color: #38bdf8; }
    .header-titles p { font-size: 0.85rem; color: #94a3b8; }
    .nav-btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; font-size: 0.85rem; font-weight: 600; text-decoration: none; border-radius: 8px; border: 1px solid #38bdf8; background: rgba(56, 189, 248, 0.1); color: #38bdf8; transition: 0.2s; }
    .nav-btn:hover { background: #0284c7; color: #fff; }

    .main-container { display: flex; flex-wrap: wrap; gap: 16px; justify-content: center; max-width: 1100px; width: 100%; }
    
    .video-card { position: relative; width: 480px; max-width: 100%; border-radius: 12px; overflow: hidden; background: #000; border: 2px solid #334155; aspect-ratio: 4/3; }
    video, canvas { width: 100%; height: 100%; object-fit: cover; display: block; transform: scaleX(-1); }
    canvas { position: absolute; top: 0; left: 0; }
    .countdown-overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 5rem; font-weight: 800; color: #facc15; background: rgba(0,0,0,0.55); pointer-events: none; opacity: 0; transition: opacity 0.2s; z-index: 10; text-shadow: 0 4px 12px rgba(0,0,0,0.8); }
    
    .controls-card { flex: 1; min-width: 320px; background: #1e293b; padding: 16px; border-radius: 12px; border: 1px solid #334155; display: flex; flex-direction: column; gap: 12px; }
    .input-group label { font-size: 0.8rem; font-weight: 600; color: #94a3b8; display: block; margin-bottom: 4px; }
    .input-group input { width: 100%; padding: 8px 12px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: #fff; font-size: 0.95rem; }
    
    .quick-tags { display: flex; flex-wrap: wrap; gap: 6px; max-height: 110px; overflow-y: auto; padding: 6px; background: #0f172a; border-radius: 6px; border: 1px solid #334155; }
    .tag-btn { padding: 4px 8px; font-size: 0.75rem; font-weight: 600; background: #334155; border: none; border-radius: 4px; color: #f8fafc; cursor: pointer; transition: 0.15s; }
    .tag-btn:hover { background: #0284c7; }
    
    .btn-record { padding: 12px; font-size: 1rem; font-weight: 700; border-radius: 8px; border: none; background: #0284c7; color: #fff; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3); }
    .btn-record:disabled { background: #475569; cursor: not-allowed; opacity: 0.7; box-shadow: none; }
    
    .btn-push-gh { padding: 12px; font-size: 0.95rem; font-weight: 700; border-radius: 8px; border: none; background: linear-gradient(135deg, #6366f1, #8b5cf6); color: #fff; cursor: pointer; box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3); }
    .btn-download { padding: 10px; font-size: 0.85rem; font-weight: 600; border-radius: 6px; border: 1px solid #10b981; background: rgba(16, 185, 129, 0.1); color: #10b981; cursor: pointer; }
    .btn-pull-gh { padding: 10px; font-size: 0.85rem; font-weight: 600; border-radius: 6px; border: 1px solid #38bdf8; background: rgba(56, 189, 248, 0.1); color: #38bdf8; cursor: pointer; }
    .btn-clear { padding: 8px; font-size: 0.8rem; border-radius: 6px; border: 1px solid #ef4444; background: transparent; color: #ef4444; cursor: pointer; }
    
    .action-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .status-box { background: #0f172a; padding: 10px; border-radius: 6px; font-size: 0.85rem; border: 1px solid #334155; }
    .table-container { max-height: 120px; overflow-y: auto; font-size: 0.8rem; border: 1px solid #334155; border-radius: 6px; }
    table { width: 100%; border-collapse: collapse; }
    th { background: #0f172a; color: #94a3b8; position: sticky; top: 0; }
    td, th { padding: 6px 10px; text-align: left; border-bottom: 1px solid #334155; }
    
    details.gh-config { background: #0f172a; padding: 8px 12px; border-radius: 6px; border: 1px solid #334155; font-size: 0.8rem; }
    details.gh-config summary { cursor: pointer; color: #94a3b8; font-weight: 600; }
    .gh-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 8px; }
    .gh-fields input { padding: 6px 8px; border-radius: 4px; border: 1px solid #475569; background: #1e293b; color: #fff; font-size: 0.75rem; width: 100%; }
  </style>
</head>
<body>

  <header>
    <div class="header-titles">
      <h1>Studio Perekam Dataset Isyarat (126 Fitur)</h1>
      <p>Rekam alfabet, angka, dan kata dua tangan langsung ke repositori GitHub</p>
    </div>
    <a href="index.html" class="nav-btn">⬅ Kembali ke Penerjemah</a>
  </header>
  
  <div class="main-container">
    <div class="video-card">
      <video id="webcam" playsinline></video>
      <canvas id="output_canvas"></canvas>
      <div id="countdown" class="countdown-overlay">3</div>
    </div>

    <div class="controls-card">
      <details class="gh-config" open>
        <summary>⚙️ Pengaturan Repositori & Token GitHub</summary>
        <div class="gh-fields">
          <input type="text" id="ghOwner" placeholder="Owner" value="wahyudi-lesson">
          <input type="text" id="ghRepo" placeholder="Repo" value="bahasaisyarat">
          <input type="password" id="ghToken" placeholder="GitHub Personal Access Token" style="grid-column: span 2;">
        </div>
      </details>

      <div class="input-group">
        <label>Label Target (Huruf / Angka / Kosakata):</label>
        <input type="text" id="targetLabel" value="A" placeholder="Misal: A, B, 1, HALO, TERIMA_KASIH">
      </div>

      <div class="input-group">
        <label>Pilihan Cepat:</label>
        <div class="quick-tags" id="presetContainer"></div>
      </div>

      <div class="input-group">
        <label>Jumlah Frame Sekali Rekam:</label>
        <input type="number" id="targetFrames" value="80" min="20" max="300">
      </div>

      <button id="btnStartRecord" class="btn-record">Mulai Rekam (Hitung Mundur 3d)</button>

      <div class="status-box">
        <div>Status: <b id="lblStatus" style="color:#38bdf8;">Kamera Memuat...</b></div>
        <div>Total Dataset di Memori: <b id="lblTotalRows">0</b> baris</div>
      </div>

      <div class="table-container">
        <table>
          <thead><tr><th>Label</th><th>Jumlah Sampel</th></tr></thead>
          <tbody id="summaryBody"></tbody>
        </table>
      </div>

      <button id="btnPushGitHub" class="btn-push-gh">🚀 Kirim ke GitHub & Latih Otomatis</button>

      <div class="action-row">
        <button id="btnPullGitHub" class="btn-pull-gh">📥 Tarik Data Lama GitHub</button>
        <button id="btnDownload" class="btn-download">💾 Unduh Backup CSV</button>
      </div>
      
      <button id="btnClear" class="btn-clear">Reset / Kosongkan Memori Lokal</button>
    </div>
  </div>

  <script>
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('output_canvas');
    const ctx = canvas.getContext('2d');
    const countdownEl = document.getElementById('countdown');
    const lblStatus = document.getElementById('lblStatus');
    const lblTotalRows = document.getElementById('lblTotalRows');
    const summaryBody = document.getElementById('summaryBody');
    const btnRecord = document.getElementById('btnStartRecord');
    const targetLabelInput = document.getElementById('targetLabel');
    const targetFramesInput = document.getElementById('targetFrames');
    
    const ghOwnerInput = document.getElementById('ghOwner');
    const ghRepoInput = document.getElementById('ghRepo');
    const ghTokenInput = document.getElementById('ghToken');

    let current126Landmarks = null;
    let dataset = [];
    let labelCounts = {};
    let latestFileSha = null;

    // Muat konfigurasi default repositori wahyudi-lesson/bahasaisyarat
    ghOwnerInput.value = localStorage.getItem('gh_owner') || 'wahyudi-lesson';
    ghRepoInput.value = localStorage.getItem('gh_repo') || 'bahasaisyarat';
    ghTokenInput.value = localStorage.getItem('gh_token') || '';

    [ghOwnerInput, ghRepoInput, ghTokenInput].forEach(inp => {
      inp.addEventListener('input', () => {
        localStorage.setItem('gh_owner', ghOwnerInput.value.trim());
        localStorage.setItem('gh_repo', ghRepoInput.value.trim());
        localStorage.setItem('gh_token', ghTokenInput.value.trim());
      });
    });

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function beep(freq = 600, duration = 120) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.frequency.value = freq;
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      setTimeout(() => osc.stop(), duration);
    }

    const HAND_CONNECTIONS = [
      [0, 1], [1, 2], [2, 3], [3, 4],
      [0, 5], [5, 6], [6, 7], [7, 8],
      [5, 9], [9, 10], [10, 11], [11, 12],
      [9, 13], [13, 14], [14, 15], [15, 16],
      [13, 17], [17, 18], [18, 19], [19, 20],
      [0, 17]
    ];

    const presets = [..."ABCDEFGHIJKLMNOPQRSTUVWXYZ", ..."0123456789", "HALO", "TERIMA_KASIH", "MAAF", "SAMA_SAMA"];
    const presetBox = document.getElementById('presetContainer');
    presets.forEach(p => {
      const b = document.createElement('button');
      b.className = 'tag-btn';
      b.textContent = p;
      b.onclick = () => { targetLabelInput.value = p; };
      presetBox.appendChild(b);
    });

    const hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    hands.setOptions({
      maxNumHands: 2,
      modelComplexity: 1,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });

    hands.onResults((results) => {
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        results.multiHandLandmarks.forEach((landmarks) => {
          ctx.strokeStyle = '#22c55e';
          ctx.lineWidth = 3;
          HAND_CONNECTIONS.forEach(([i, j]) => {
            const p1 = landmarks[i];
            const p2 = landmarks[j];
            ctx.beginPath();
            ctx.moveTo(p1.x * canvas.width, p1.y * canvas.height);
            ctx.lineTo(p2.x * canvas.width, p2.y * canvas.height);
            ctx.stroke();
          });

          landmarks.forEach(pt => {
            ctx.beginPath();
            ctx.arc(pt.x * canvas.width, pt.y * canvas.height, 4, 0, 2 * Math.PI);
            ctx.fillStyle = '#ef4444';
            ctx.fill();
          });
        });

        current126Landmarks = window.normalizeLandmarks126 ? window.normalizeLandmarks126(results) : null;
      } else {
        current126Landmarks = null;
      }
    });

    const camera = new Camera(video, {
      onFrame: async () => { await hands.send({ image: video }); },
      width: 640,
      height: 480
    });
    camera.start().then(() => {
      lblStatus.textContent = "Kamera Aktif & Siap Merekam";
      lblStatus.style.color = "#10b981";
    });

    btnRecord.onclick = async () => {
      const label = targetLabelInput.value.trim().toUpperCase();
      if (!label) return alert("Harap isi label terlebih dahulu!");
      const targetCount = parseInt(targetFramesInput.value) || 80;

      btnRecord.disabled = true;
      countdownEl.style.opacity = '1';

      for (let i = 3; i > 0; i--) {
        countdownEl.textContent = i;
        beep(500, 100);
        await new Promise(r => setTimeout(r, 1000));
      }
      countdownEl.textContent = "REKAM!";
      beep(1000, 250);
      await new Promise(r => setTimeout(r, 400));
      countdownEl.style.opacity = '0';

      lblStatus.textContent = `Merekam ${label}... (Gerakkan sudut tangan perlahan)`;
      lblStatus.style.color = "#facc15";

      let collected = 0;
      while (collected < targetCount) {
        if (current126Landmarks) {
          dataset.push([...current126Landmarks, label]);
          collected++;
          lblStatus.textContent = `Merekam ${label}: ${collected} / ${targetCount}`;
        }
        await new Promise(r => setTimeout(r, 40));
      }

      beep(800, 200);
      labelCounts[label] = (labelCounts[label] || 0) + collected;
      updateTable();
      lblStatus.textContent = `Selesai merekam kelas ${label}!`;
      lblStatus.style.color = "#10b981";
      btnRecord.disabled = false;
    };

    function updateTable() {
      lblTotalRows.textContent = dataset.length;
      summaryBody.innerHTML = '';
      for (const [k, v] of Object.entries(labelCounts)) {
        summaryBody.innerHTML += `<tr><td><b>${k}</b></td><td>${v} frame</td></tr>`;
      }
    }

    function buildCsvString() {
      const headers = [];
      for (let i = 0; i < 42; i++) {
        headers.push(`x${i}`, `y${i}`, `z${i}`);
      }
      headers.push('label');
      return headers.join(',') + '\n' + dataset.map(row => row.join(',')).join('\n') + '\n';
    }

    document.getElementById('btnPushGitHub').onclick = async () => {
      if (dataset.length === 0) return alert("Belum ada data rekaman untuk dikirim!");

      const owner = ghOwnerInput.value.trim();
      const repo = ghRepoInput.value.trim();
      let token = ghTokenInput.value.trim();

      if (!token) {
        token = prompt("Masukkan GitHub Fine-grained Personal Access Token:");
        if (!token) return;
        ghTokenInput.value = token;
        localStorage.setItem('gh_token', token);
      }

      const filePath = "dataset_landmarks.csv";
      const apiUrl = `https://api.github.com/repos/${owner}/${repo}/contents/${filePath}`;

      lblStatus.textContent = "Menghubungi GitHub API...";
      lblStatus.style.color = "#facc15";

      try {
        const getRes = await fetch(apiUrl, {
          headers: { 
            "Authorization": `Bearer ${token}`,
            "Accept": "application/vnd.github.v3+json"
          }
        });
        if (getRes.ok) {
          const fileData = await getRes.json();
          latestFileSha = fileData.sha;
        }

        const csvContent = buildCsvString();
        const encodedContent = btoa(unescape(encodeURIComponent(csvContent)));

        const payload = {
          message: `data: update dataset_landmarks.csv (${dataset.length} baris via collector)`,
          content: encodedContent,
          branch: "main"
        };
        if (latestFileSha) payload.sha = latestFileSha;

        const putRes = await fetch(apiUrl, {
          method: "PUT",
          headers: {
            "Authorization": `Bearer ${token}`,
            "Accept": "application/vnd.github.v3+json",
            "Content-Type": "application/json"
          },
          body: JSON.stringify(payload)
        });

        if (!putRes.ok) {
          const errData = await putRes.json();
          throw new Error(errData.message || "Gagal melakukan commit ke GitHub");
        }

        const putData = await putRes.json();
        latestFileSha = putData.content.sha;

        lblStatus.textContent = "Berhasil dikirim! GitHub Actions mulai melatih model...";
        lblStatus.style.color = "#10b981";
        alert("Sukses! File dataset_landmarks.csv berhasil diperbarui di GitHub.\n\nGitHub Actions sedang melatih model otomatis (~2 menit).");

      } catch (err) {
        console.error(err);
        lblStatus.textContent = "Gagal kirim: " + err.message;
        lblStatus.style.color = "#ef4444";
        alert("Gagal mengirim ke GitHub: " + err.message);
      }
    };

    document.getElementById('btnPullGitHub').onclick = async () => {
      const owner = ghOwnerInput.value.trim();
      const repo = ghRepoInput.value.trim();
      const token = ghTokenInput.value.trim();
      const apiUrl = `https://api.github.com/repos/${owner}/${repo}/contents/dataset_landmarks.csv`;

      lblStatus.textContent = "Mengunduh dataset dari GitHub...";
      lblStatus.style.color = "#38bdf8";

      try {
        const headers = { "Accept": "application/vnd.github.v3+json" };
        if (token) headers["Authorization"] = `Bearer ${token}`;

        const res = await fetch(apiUrl, { headers });
        if (!res.ok) throw new Error("File dataset_landmarks.csv belum ada di repositori GitHub.");

        const data = await res.json();
        latestFileSha = data.sha;

        const decodedText = decodeURIComponent(escape(atob(data.content.replace(/\s/g, ''))));
        const lines = decodedText.trim().split('\n');
        if (lines.length <= 1) return alert("Dataset di GitHub masih kosong.");

        dataset = [];
        labelCounts = {};
        for (let i = 1; i < lines.length; i++) {
          const cols = lines[i].split(',');
          if (cols.length >= 127) {
            const rowVals = cols.slice(0, 126).map(Number);
            const lbl = cols[126].trim();
            dataset.push([...rowVals, lbl]);
            labelCounts[lbl] = (labelCounts[lbl] || 0) + 1;
          }
        }

        updateTable();
        lblStatus.textContent = `Berhasil memuat ${dataset.length} baris dari GitHub!`;
        lblStatus.style.color = "#10b981";
      } catch (err) {
        console.error(err);
        alert(err.message);
        lblStatus.textContent = "Gagal memuat dari GitHub";
        lblStatus.style.color = "#ef4444";
      }
    };

    document.getElementById('btnDownload').onclick = () => {
      if (dataset.length === 0) return alert("Belum ada data untuk diunduh!");
      const csvContent = buildCsvString();
      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'dataset_landmarks.csv';
      a.click();
      URL.revokeObjectURL(url);
    };

    document.getElementById('btnClear').onclick = () => {
      if (confirm("Kosongkan data yang tersimpan di memori saat ini?")) {
        dataset = [];
        labelCounts = {};
        updateTable();
        lblStatus.textContent = "Data di memori telah dibersihkan";
      }
    };
  </script>
</body>
</html>
